<!doctype html>
<html lang="en" data-t="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SYLLABUSIQ — Universal Syllabus Intelligence</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #fff;
            --fg: #0f172a;
            --mut: #64748b;
            --bd: #e4e7ec;
            --hov: #f1f3f7;
            --pri: #3949c9;
            --pris: #eceefd;
            --ok: #15803d;
            --oks: #e7f5ec;
            --wn: #a15c07;
            --wns: #fdf1dc;
            --er: #b42318;
            --ers: #fdeceb;
            --in: #0b6aa2;
            --ins: #e5f2fa;
            --sh: 0 1px 2px rgba(16, 24, 40, .05);
            --mono: ui-monospace, "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace;
        }

        [data-t=dark] {
            --bg: #0d1017;
            --card: #151a23;
            --fg: #e6e9ef;
            --mut: #8b95a7;
            --bd: #262d3a;
            --hov: #1c2230;
            --pri: #8b97ff;
            --pris: #1f2547;
            --ok: #4ade80;
            --oks: #12281b;
            --wn: #fbbf24;
            --wns: #2c2210;
            --er: #f87171;
            --ers: #2d1614;
            --in: #5cc0f5;
            --ins: #0f2531;
            --sh: none
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            font: 14px/1.5 Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        a {
            color: inherit;
            text-decoration: none
        }

        :focus-visible {
            outline: 2px solid var(--pri);
            outline-offset: 2px;
            border-radius: 6px
        }

        .i {
            flex: none
        }

        h1 {
            font-size: 24px;
            letter-spacing: -.02em;
            font-weight: 650
        }

        h2 {
            font-size: 15px;
            font-weight: 600
        }

        h3 {
            font-size: 14px;
            font-weight: 600
        }

        .app {
            display: grid;
            grid-template-columns: var(--sw) 1fr;
            height: 100vh;
            --sw: 248px;
            transition: grid-template-columns .2s
        }

        .app.col {
            --sw: 66px
        }

        aside {
            background: var(--card);
            border-right: 1px solid var(--bd);
            display: flex;
            flex-direction: column;
            padding: 14px 10px;
            gap: 2px;
            overflow: auto;
            z-index: 30
        }

        .logo {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 4px 8px 14px
        }

        .logo b {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--pri);
            color: #fff;
            font-size: 13px
        }

        .logo strong {
            font-size: 14px;
            letter-spacing: .06em
        }

        .logo small {
            display: block;
            color: var(--mut);
            font-size: 11px
        }

        .nl {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 9px;
            color: var(--mut);
            font-weight: 500;
            border: 0;
            background: none;
            width: 100%;
            text-align: left;
            transition: .15s
        }

        .nl:hover {
            background: var(--hov);
            color: var(--fg)
        }

        .nl.on {
            background: var(--pris);
            color: var(--pri)
        }

        .nl[disabled] {
            opacity: .5;
            cursor: not-allowed
        }

        .sec {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--mut);
            padding: 14px 10px 4px
        }

        .col .lbl,
        .col .sec,
        .col .logo div,
        .col .usr div {
            display: none
        }

        .col .nl {
            justify-content: center
        }

        .usr {
            margin-top: auto;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 8px;
            border-top: 1px solid var(--bd)
        }

        .av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--pris);
            color: var(--pri);
            display: grid;
            place-items: center;
            font-weight: 600;
            flex: none
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            border-bottom: 1px solid var(--bd);
            background: color-mix(in srgb, var(--card) 85%, transparent);
            backdrop-filter: blur(10px)
        }

        .crumb {
            color: var(--mut);
            font-size: 13px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .crumb b {
            color: var(--fg);
            font-weight: 500
        }

        .sb {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--bd);
            border-radius: 9px;
            padding: 0 10px;
            background: var(--card);
            height: 34px;
            width: 230px
        }

        .sb input {
            border: 0;
            background: none;
            outline: 0;
            width: 100%
        }

        .ib {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 1px solid var(--bd);
            background: var(--card);
            border-radius: 9px;
            color: var(--mut)
        }

        .ib:hover {
            background: var(--hov);
            color: var(--fg)
        }

        #view {
            flex: 1;
            overflow: auto;
            padding: 24px;
            animation: fi .25s
        }

        @keyframes fi {
            from {
                opacity: 0;
                transform: translateY(4px)
            }
        }

        .wrap {
            max-width: 1280px;
            margin: 0 auto
        }

        .ph {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap
        }

        .ph p {
            color: var(--mut);
            margin-top: 4px;
            max-width: 640px
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .sp {
            flex: 1
        }

        .mut {
            color: var(--mut)
        }

        .mono {
            font-family: var(--mono);
            font-size: 12.5px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            box-shadow: var(--sh);
            padding: 18px
        }

        .card>h2 {
            margin-bottom: 12px
        }

        .g {
            display: grid;
            gap: 16px
        }

        .g4 {
            grid-template-columns: repeat(4, 1fr)
        }

        .g2 {
            grid-template-columns: 2fr 1fr
        }

        .btn {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            height: 36px;
            padding: 0 14px;
            border-radius: 9px;
            border: 1px solid var(--bd);
            background: var(--card);
            font-weight: 500;
            transition: .15s;
            white-space: nowrap
        }

        .btn:hover {
            background: var(--hov)
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn.pri {
            background: var(--pri);
            border-color: var(--pri);
            color: #fff
        }

        [data-t=dark] .btn.pri {
            color: #0d1017
        }

        .btn.pri:hover {
            filter: brightness(1.08)
        }

        .btn.gh {
            border-color: transparent;
            background: none
        }

        .btn.gh:hover {
            background: var(--hov)
        }

        .btn.sm {
            height: 28px;
            padding: 0 9px;
            font-size: 12.5px
        }

        .btn[disabled] {
            opacity: .5;
            pointer-events: none
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500;
            background: var(--hov);
            color: var(--mut);
            white-space: nowrap
        }

        .badge.ok {
            background: var(--oks);
            color: var(--ok)
        }

        .badge.wn {
            background: var(--wns);
            color: var(--wn)
        }

        .badge.er {
            background: var(--ers);
            color: var(--er)
        }

        .badge.in {
            background: var(--ins);
            color: var(--in)
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--mut)
        }

        .dot.ok {
            background: var(--ok)
        }

        .dot.er {
            background: var(--er)
        }

        .dot.wn {
            background: var(--wn)
        }

        .kpi {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .kpi .n {
            font-size: 30px;
            font-weight: 650;
            letter-spacing: -.03em;
            line-height: 1.1
        }

        .kpi .t {
            display: flex;
            justify-content: space-between;
            color: var(--mut);
            font-size: 13px
        }

        .tw {
            overflow: auto;
            border: 1px solid var(--bd);
            border-radius: 12px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--mut);
            text-align: left;
            padding: 10px 14px;
            background: var(--hov);
            white-space: nowrap
        }

        td {
            padding: 11px 14px;
            border-top: 1px solid var(--bd)
        }

        tr:hover td {
            background: var(--hov)
        }

        td.c,
        th.c {
            text-align: center
        }

        .tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--bd);
            margin-bottom: 16px;
            overflow: auto
        }

        .tabs button {
            border: 0;
            background: none;
            padding: 9px 13px;
            color: var(--mut);
            font-weight: 500;
            border-bottom: 2px solid transparent;
            white-space: nowrap
        }

        .tabs button:hover {
            color: var(--fg)
        }

        .tabs button[aria-selected=true] {
            color: var(--pri);
            border-color: var(--pri)
        }

        input[type=text],
        input[type=number],
        select,
        textarea {
            border: 1px solid var(--bd);
            background: var(--card);
            border-radius: 9px;
            height: 36px;
            padding: 0 10px;
            min-width: 0
        }

        textarea {
            height: 90px;
            padding: 8px 10px;
            width: 100%
        }

        .drop {
            border: 1.5px dashed var(--bd);
            border-radius: 16px;
            padding: 44px 20px;
            text-align: center;
            background: var(--card);
            transition: .2s
        }

        .drop.ov,
        .drop:hover {
            border-color: var(--pri);
            background: var(--pris)
        }

        .drop .ic {
            display: inline-grid;
            place-items: center;
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--pris);
            color: var(--pri);
            margin-bottom: 12px
        }

        .bar {
            height: 6px;
            border-radius: 9px;
            background: var(--hov);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--pri);
            transition: width .4s
        }

        .opts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .opt {
            display: block;
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: .15s
        }

        .opt:hover {
            background: var(--hov)
        }

        .opt:has(input:checked) {
            border-color: var(--pri);
            background: var(--pris)
        }

        .opt input {
            accent-color: var(--pri);
            margin-right: 6px
        }

        .opt small {
            display: block;
            color: var(--mut);
            margin-top: 4px
        }

        .chk {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px 16px
        }

        .chk label,
        .tg {
            display: flex;
            gap: 8px;
            align-items: center
        }

        input[type=checkbox] {
            accent-color: var(--pri);
            width: 16px;
            height: 16px
        }

        .note {
            display: flex;
            gap: 12px;
            border: 1px solid var(--bd);
            border-left: 3px solid var(--in);
            background: var(--ins);
            border-radius: 12px;
            padding: 14px 16px
        }

        .note ul {
            margin: 6px 0 0 18px;
            color: var(--mut)
        }

        details {
            border: 1px solid var(--bd);
            border-radius: 11px;
            background: var(--card);
            margin-bottom: 8px
        }

        summary {
            padding: 11px 14px;
            cursor: pointer;
            font-weight: 500;
            list-style: none;
            display: flex;
            gap: 8px;
            align-items: center
        }

        summary::-webkit-details-marker {
            display: none
        }

        details[open]>summary .cv {
            transform: rotate(90deg)
        }

        .cv {
            transition: .15s
        }

        .db {
            padding: 4px 14px 14px
        }

        .adv {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px
        }

        .adv label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12.5px;
            color: var(--mut)
        }

        .steps {
            display: flex;
            flex-direction: column
        }

        .step {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            position: relative
        }

        .step .m {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--hov);
            color: var(--mut);
            flex: none;
            font-size: 12px;
            z-index: 1
        }

        .step.done .m {
            background: var(--oks);
            color: var(--ok)
        }

        .step.run .m {
            background: var(--pris);
            color: var(--pri);
            animation: pl 1.4s infinite
        }

        .step.warn .m {
            background: var(--wns);
            color: var(--wn)
        }

        .step.fail .m {
            background: var(--ers);
            color: var(--er)
        }

        .step:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 12.5px;
            top: 36px;
            bottom: -6px;
            width: 1px;
            background: var(--bd)
        }

        @keyframes pl {
            50% {
                box-shadow: 0 0 0 6px transparent;
                opacity: .7
            }
        }

        .skel {
            border-radius: 8px;
            background: linear-gradient(90deg, var(--hov) 25%, var(--bd) 50%, var(--hov) 75%);
            background-size: 200% 100%;
            animation: sk 1.2s infinite;
            height: 16px
        }

        @keyframes sk {
            to {
                background-position: -200% 0
            }
        }

        .empty {
            text-align: center;
            padding: 56px 20px
        }

        .empty .ic {
            display: inline-grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--hov);
            color: var(--mut);
            margin-bottom: 12px
        }

        .empty p {
            color: var(--mut);
            margin: 4px 0 16px
        }

        .eb {
            display: flex;
            gap: 14px;
            border-color: color-mix(in srgb, var(--er) 40%, var(--bd))
        }

        .eb>.i {
            color: var(--er);
            margin-top: 2px
        }

        .eb p {
            margin: 4px 0;
            color: var(--mut)
        }

        .eb .row {
            margin-top: 10px
        }

        .doc {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr) 420px;
            gap: 14px;
            height: calc(100vh - 150px);
            min-height: 480px
        }

        .doc>.card {
            padding: 0;
            overflow: auto;
            display: flex;
            flex-direction: column
        }

        .pn {
            padding: 14px;
            overflow: auto;
            flex: 1
        }

        .pdf {
            background: var(--hov);
            flex: 1;
            overflow: auto;
            padding: 16px;
            text-align: center
        }

        .pdf canvas {
            background: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
            max-width: none
        }

        .tb {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--bd);
            flex-wrap: wrap
        }

        .th {
            display: block;
            width: 100%;
            border: 2px solid transparent;
            border-radius: 8px;
            background: none;
            padding: 2px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 12px;
            color: var(--mut)
        }

        .th.on {
            border-color: var(--pri);
            background: var(--pris);
            color: var(--pri)
        }

        .th canvas {
            width: 100%;
            display: block;
            background: #fff;
            border-radius: 4px;
            min-height: 60px
        }

        .fld {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 8px;
            padding: 9px 0;
            border-top: 1px solid var(--bd);
            align-items: center
        }

        .fld:first-child {
            border: 0
        }

        .val {
            font-weight: 500;
            word-break: break-word
        }

        .src {
            font-family: var(--mono);
            font-size: 12px;
            background: var(--hov);
            padding: 8px 10px;
            border-radius: 8px;
            white-space: pre-wrap;
            color: var(--fg);
            margin-top: 6px
        }

        mark {
            background: color-mix(in srgb, var(--wn) 35%, transparent);
            color: inherit;
            border-radius: 3px
        }

        .mx td,
        .mx th {
            text-align: center;
            padding: 8px 10px
        }

        .mx td button {
            width: 32px;
            height: 28px;
            border: 1px solid var(--bd);
            background: var(--card);
            border-radius: 7px;
            font-family: var(--mono)
        }

        .mx td button.z {
            color: var(--mut);
            opacity: .5
        }

        .mx td button.on {
            background: var(--pri);
            color: #fff
        }

        .pg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px
        }

        .pc {
            border: 1px solid var(--bd);
            border-radius: 12px;
            background: var(--card);
            padding: 8px;
            text-align: left;
            transition: .15s
        }

        .pc:hover {
            border-color: var(--pri);
            transform: translateY(-1px)
        }

        .pc canvas {
            width: 100%;
            display: block;
            background: #fff;
            border-radius: 6px;
            min-height: 90px;
            border: 1px solid var(--bd)
        }

        .tr {
            padding: 10px 0;
            border-top: 1px solid var(--bd)
        }

        .tr:first-child {
            border: 0
        }

        #toasts {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 99
        }

        .toast {
            background: var(--fg);
            color: var(--bg);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            animation: fi .25s;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .2)
        }

        .toast.er {
            background: var(--er);
            color: #fff
        }

        .md {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 25, .5);
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 20px;
            animation: fi .15s
        }

        .mb {
            background: var(--card);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            border: 1px solid var(--bd)
        }

        .dev {
            background: var(--wns);
            color: var(--wn);
            text-align: center;
            padding: 5px;
            font-size: 12.5px;
            font-weight: 500
        }

        .bn {
            display: none
        }

        .ev2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        @media(max-width:1200px) {
            .doc {
                grid-template-columns: 130px minmax(0, 1fr);
                height: auto
            }

            .doc>.card:last-child {
                grid-column: 1/-1;
                min-height: 420px
            }

            .doc>.card {
                max-height: 80vh
            }

            .g4 {
                grid-template-columns: repeat(2, 1fr)
            }

            .g2 {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:860px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                position: fixed;
                inset: 0 auto 0 0;
                width: 250px;
                transform: translateX(-100%);
                transition: .2s
            }

            .app.open aside {
                transform: none;
                box-shadow: 0 0 40px rgba(0, 0, 0, .3)
            }

            .app.col .lbl,
            .app.col .sec,
            .app.col .logo div,
            .app.col .usr div {
                display: revert
            }

            .opts,
            .ev2 {
                grid-template-columns: 1fr
            }

            .doc {
                grid-template-columns: 1fr
            }

            .sb {
                display: none
            }

            header {
                padding: 10px 14px
            }

            #view {
                padding: 14px
            }

            .bn {
                display: inline-grid
            }

 <div class="tabs" role="tablist"><button role="tab" aria-selected="${!cat}" data-a="tab" data-g="rv" data-k="">All (${all.length})</button>${cats.map(k => `<button role="tab" aria-selected="${cat == k}" data-a="tab" data-g="rv" data-k="${k}">${k} (${all.filter(i => i.cat == k).length})</button>`).join('')}</div>
 ${all.length ? all.filter(i => !cat || i.cat == cat).map(i => {
                const v = rv[i.id], ci = doc.courses.findIndex(c => dkey(c) == i.course); return `<div class="card" style="margin-bottom:10px"><div class="row"><span class="badge wn">${i.cat}</span><b>${esc(i.course)}</b><span class="mono mut">${esc(i.field)}</span><span class="sp"></span>${v ? `<span class="badge ${v.s == 'accepted' ? 'ok' : 'in'}">${v.s}</span>` : ''}</div>
 <div class="ev2" style="margin-top:8px"><div><small class="mut">Original extracted value (never overwritten)</small><div class="src">${i.val === '' ? '(empty)' : esc(i.val)}</div></div><div><small class="mut">Human corrected value</small><div class="src">${v?.corrected != null ? esc(v.corrected) : '—'}</div></div></div><p class="mut" style="margin:8px 0">${esc(i.why)} · Source page ${i.page ?? '—'}</p>
 <div class="row"><a class="btn sm" href="#/course/${doc.id}/${ci}" data-a="viewsrc" data-p="${i.page || ''}">${I('eye', 14)}View source</a><button class="btn sm" data-a="acc" data-id="${esc(i.id)}">Accept</button><button class="btn sm" data-a="cor" data-id="${esc(i.id)}">${I('pen', 14)}Correct</button>${v ? `<small class="mut">Audit: ${v.s} ${ago(v.at)}</small>` : ''}</div></div>`
            }).join('') : empty('ok', 'No issues flagged', 'Nothing needs attention right now.')}`)
        };

        /* ---------- 5g. EXPORTS ---------- */
        R.exports = async () => {
            crumb('Exports'); skel(); const r = await getDoc('current'); const head = `<div class="ph"><div><h1>Export Center</h1><p>Export the validated result with its provenance.</p></div></div>`; if (!r.ok) return set(head + errBox(r)); const doc = r.data; if (!doc) return set(head + empty('down', 'Nothing to export yet', 'Extract a syllabus first.', upBtn));
            const H = ls('siqExp', []); set(head + `<div class="g g2"><div class="card"><h2>Generate export · <span class="mono">${esc(doc.filename)}</span></h2><b>Format</b><div class="opts" style="grid-template-columns:repeat(4,1fr);margin:8px 0 16px">${['JSON', 'Excel', 'CSV', 'PDF Report'].map((f, i) => `<label class="opt"><input type="radio" name="fmt" value="${['json', 'xlsx', 'csv', 'pdf'][i]}" ${i ? '' : 'checked'}>${f}</label>`).join('')}</div>
 <div class="chk" style="margin-bottom:16px"><label><input type="radio" name="scope" value="all" checked>Entire document</label><label><input type="radio" name="scope" value="sel">Course selection (${S.sel.size} selected)</label><label><input type="checkbox" id="xv">Only validated fields</label><label><input type="checkbox" id="xs" checked>Include source pages</label><label><input type="checkbox" id="xp" checked>Include provenance</label><label><input type="checkbox" id="xr" checked>Include review history</label></div><button class="btn pri" data-a="gen">Generate Export</button></div>
 <div class="card"><h2>Export history</h2>${H.length ? H.map(h => `<div class="tr"><b>${esc(h.f)}</b> <span class="badge ${h.ok ? 'ok' : 'er'}">${h.ok ? 'Done' : 'Failed'}</span><div class="mut">${esc(h.n)} · ${ago(h.at)}</div></div>`).join('') : '<p class="mut">No exports yet.</p>'}</div></div>`)
        };
        function build(doc, o) {
            let C = doc.courses.map((c, i) => ({ c, i })); if (o.scope == 'sel' && S.sel.size) C = C.filter(x => S.sel.has(x.i)); const rv = rev(doc.id), bad = new Set(chk(doc).filter(x => !x.ok).map(x => x.k + x.t.id));
            return { document: doc.filename, course_count: C.length, courses: C.map(({ c }) => { const d = detOf(doc, c), o2 = { code: c.code, title: c.title, page: c.page }; if (o.src && d) o2.pages = d.course.pages; if (d) { const dd = JSON.parse(JSON.stringify(d)); if (o.val) dd.units?.forEach(u => u.topics = u.topics.filter(t => !bad.has(dkey(c) + t.id))); o2.detail = dd } return o2 }), ...(o.rev ? { review_history: rv } : {}), ...(o.prov ? { provenance: 'source pages listed per course; extraction is AI-generated and unverified beyond client checks' } : {}) }
        }
        async function gen() {
            const doc = S.doc, f = $('input[name=fmt]:checked').value, o = { scope: $('input[name=scope]:checked').value, val: $('#xv').checked, src: $('#xs').checked, prov: $('#xp').checked, rev: $('#xr').checked }; let blob, name = doc.filename.replace(/\.pdf$/i, '') + '.' + (f == 'xlsx' ? 'xlsx' : f), ok = true;
            if (f == 'json') blob = new Blob([JSON.stringify(build(doc, o), null, 2)], { type: 'application/json' });
            else if (f == 'csv') { const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`; blob = new Blob(['\ufeff' + ['code,title,page,category,credits', '', ...build(doc, o).courses.map(c => [c.code, c.title, c.page, doc.courses.find(x => dkey(x) == (c.code || c.title))?.category, doc.courses.find(x => dkey(x) == (c.code || c.title))?.credits].map(q).join(','))].join('\n')], { type: 'text/csv' }) }
            else { const r = await API.exportDoc(doc.id, { format: f, scope: o.scope, validated_only: o.val, include_source: o.src, include_provenance: o.prov, include_review: o.rev }); ok = r.ok; if (ok) blob = r.data; else toast('Backend export failed: ' + (r.err || '').slice(0, 80), 'er') }
            sv('siqExp', [{ f: f.toUpperCase(), n: name, at: Date.now(), ok }, ...ls('siqExp', [])].slice(0, 15)); if (ok) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); toast('Export ready: ' + name) } R.exports()
        }

        /* ---------- 5h. SETTINGS ---------- */
        R.settings = async tab => {
            crumb('Settings'); const T = ['General', 'Extraction', 'AI Model', 'OCR', 'Validation', 'Database', 'API', 'Appearance'], t = (tab || 'general').toLowerCase().replace(' ', '-'), H = S.health || {};
            const row = (l, v) => `<div class="tr row"><span class="sp">${l}</span>${v}</div>`, ss = {
                general: row('Workspace', 'My Workspace') + row('Default extraction mode', `<b>${esc(S.set.mode)}</b>`), extraction: row('Options', `<span class="mut">Configured per run on the Extract page</span>`) + row('Fidelity', '<span class="badge ok">Source text preserved exactly</span>'),
                'ai-model': row('Provider', 'NVIDIA NIM') + row('Model', esc(S.health?.model || 'meta/llama-3.2-11b-vision-instruct')) + row('Endpoint', '<span class="mut">Configured through backend</span>') + row('API key', '<span class="mut">Never stored or shown in the frontend</span>'),
                ocr: row('Automatic OCR fallback', `<span class="badge">${S.set.ocr ? 'On' : 'Off'}</span>`) + row('Engine status', H.ocr ? `<span class="badge ok">${esc(H.ocr)}</span>` : '<span class="badge">Unknown</span>'),
                validation: row('“Verified” means', '<span class="mut">Topic wording found verbatim in its unit text</span>') + row('Bloom levels', '<span class="mut">Shown as printed / inferred</span>'),
                database: row('MongoDB', H.database ? `<span class="badge ok">${esc(H.database)}</span>` : `<span class="badge ${apiOk ? '' : 'er'}">${apiOk ? 'Unknown' : 'Disconnected'}</span>`),
                api: `<div class="tr row"><label class="sp" for="au">Backend URL</label><input type="text" id="au" value="${esc(CFG.api)}" style="width:280px"><button class="btn" data-a="saveapi">Save</button></div>` + row('FastAPI backend', `<span class="badge ${apiOk ? 'ok' : 'er'}">${apiOk ? 'Connected' : 'Offline'}</span>`) + row('Latency', `<b>${S.ms ? S.ms + ' ms' : '—'}</b> <button class="btn sm" data-a="repi">Test</button>`) + `<label class="tr row" style="cursor:pointer"><input type="checkbox" id="mk" ${CFG.mock ? 'checked' : ''} data-a="mock"><span><b>Development mock mode</b><br><span class="mut">Serves clearly-labelled sample data instead of calling the backend. Never enable in production.</span></span></label>`,
                appearance: row('Theme', '<button class="btn" data-a="theme">Toggle light / dark</button>') + row('Sidebar', '<button class="btn" data-a="collapse">Collapse / expand</button>')
            };
            set(`<div class="ph"><div><h1>Settings</h1></div></div><div class="tabs" role="tablist">${T.map(x => { const k = x.toLowerCase().replace(' ', '-'); return `<a role="tab" aria-selected="${t == k}" href="#/settings/${k}" class="btn gh" style="border-radius:0;border-bottom:2px solid ${t == k ? 'var(--pri)' : 'transparent'};color:${t == k ? 'var(--pri)' : 'var(--mut)'}">${x}</a>` }).join('')}</div><div class="card" style="max-width:760px">${ss[t] || ss.general}</div>`)
        };

        /* ---------- 6. ACTIONS + ROUTER ---------- */
        const A = {
            theme() { const n = document.documentElement.dataset.t == 'dark' ? 'light' : 'dark'; document.documentElement.dataset.t = n; localStorage.siqTheme = n },
            collapse() { $('#app').classList.toggle('col') }, menu() { $('#app').classList.toggle('open') }, bell() { toast('No notifications') }, user() { toast('Signed in as User · My Workspace') }, goapi() { location.hash = '#/settings/api' },
            details(e) { modal(`<h2>Error details</h2><div class="src">${esc(e.dataset.d || 'No details returned')}</div><button class="btn" data-a="mclose" style="margin-top:12px">Close</button>`) },
            retry() { S.err = null; location.hash = '#/extract'; },
            back() { S.err = null; location.hash = '#/extract'; },
            browse(e, ev) { ev.stopPropagation(); $('#fi').click() }, rmfile() { S.file = null; route() }, start,
            tab(e) { S.tab[e.dataset.g == 'res' ? 'res' : e.dataset.g == 'cd' ? 'cd' : 'rv'] = e.dataset.k; route() }, ptype(e) { },
            sel(e) { const i = +e.dataset.i; e.checked ? S.sel.add(i) : S.sel.delete(i); drawTable() }, selall(e) { $$('[data-a=sel]').forEach(c => { c.checked = e.checked; e.checked ? S.sel.add(+c.dataset.i) : S.sel.delete(+c.dataset.i) }); drawTable() }, pg(e) { S.f.pg += +e.dataset.d; drawTable() },
            bulk() { if (!S.sel.size) return toast('Select courses in the table first', 'er'); location.hash = '#/exports' }, qexp(e) { S.tab.res = S.tab.res; const f = e.dataset.f; if (f == 'json') { const b = new Blob([JSON.stringify(build(S.doc, { rev: 1, src: 1, prov: 1 }), null, 2)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = S.doc.filename + '.json'; a.click() } else location.hash = '#/exports' }, gen,
            goto(e) { S.pg = +e.dataset.p; if ($('#pv')) showPage(S.pg); else toast('Open a course to preview page ' + e.dataset.p) }, pp(e) { const n = Math.max(1, S.pg + +e.dataset.d); showPage(n) }, zoom(e) { S.zoom = e.dataset.d == 0 ? 1 : Math.max(.4, S.zoom + +e.dataset.d); showPage(S.pg) }, fs() { $('#pv').requestFullscreen?.() },
            cprev() { go(-1) }, cnext() { go(1) }, viewsrc(e) { S.pg = +e.dataset.p || 1 },
            cell(e) { $$('.mx button').forEach(b => b.classList.remove('on')); e.classList.add('on'); $('#cellinfo').innerHTML = `<b>${esc(e.dataset.c)} × ${esc(e.dataset.p)}</b>\nOriginal: “${esc(e.dataset.v) || '(not mapped in source)'}”\nSource: page ${S.cur.d.course.pages?.[0] ?? '—'}` },
            evid(e) {
                const p = +e.dataset.p || null, x = e.dataset.x, h = e.dataset.h, i = h ? x.indexOf(h) : -1; modal(`<div class="row"><h2 class="sp">Source evidence</h2><button class="ib" data-a="mclose" aria-label="Close">${I('x')}</button></div><div class="ev2" style="margin-top:12px"><div class="pdf" style="border-radius:10px;min-height:260px">${p ? `<canvas id="ec" data-p="${p}" data-w="380"></canvas><div class="mut">Page ${p}</div>` : '<p class="mut">No page recorded</p>'}</div><div><small class="mut">Exact source text as extracted (not reworded)</small><div class="src">${i >= 0 ? esc(x.slice(0, i)) + '<mark>' + esc(h) + '</mark>' + esc(x.slice(i + h.length)) : esc(x)}</div><p class="mut" style="margin-top:8px;font-size:12.5px">${h && i < 0 ? 'The highlighted text was not found verbatim in this source — check the PDF.' : 'Region coordinates are not provided by the backend, so the text is highlighted instead.'}</p></div></div>`);
                pdfFor(S.doc).then(d => { const c = $('#ec'); d ? draw(d, p, c, 380) : c && (c.outerHTML = '<p class="mut">PDF preview available in the upload session only.</p>') })
            },
            acc(e) { const r = rev(S.doc.id); r[e.dataset.id] = { s: 'accepted', at: Date.now() }; saveRev(S.doc.id, r); toast('Accepted — original value kept'); route() },
            cor(e) { modal(`<h2>Correct value</h2><p class="mut">Your correction is stored beside the original, which is never overwritten.</p><textarea id="cv" aria-label="Corrected value"></textarea><div class="row" style="margin-top:12px"><button class="btn pri" data-a="savecor" data-id="${esc(e.dataset.id)}">Save correction</button><button class="btn" data-a="mclose">Cancel</button></div>`) },
            expandAllUnits() { $$('.unit-card').forEach(d => d.open = true) },
            collapseAllUnits() { $$('.unit-card').forEach(d => d.open = false) },
            jumpAll() {
                const total = S.cur?.doc?.pages || 100;
                modal(`<h2>Jump to Page</h2><p class="mut">Enter any page number between 1 and ${total}:</p>
                <div class="row" style="margin-top:12px;gap:8px">
                    <input type="number" id="jumpPageInput" value="${S.pg || 1}" min="1" max="${total}" style="width:120px" autofocus>
                    <button class="btn pri" data-a="doJump">Go to Page</button>
                    <button class="btn" data-a="mclose">Cancel</button>
                </div>`);
            },
            doJump() {
                const inp = $('#jumpPageInput');
                if (inp && inp.value) {
                    showPage(+inp.value);
                    modal('');
                }
            },
            async extractCourse(e) {
                const docId = e.dataset.id || S.doc?.id, code = e.dataset.code || '', title = e.dataset.title || '';
                const force = e.dataset.force === '1' || !!e.dataset.force;
                const courseQuery = code ? `${code} | ${title}` : title;
                e.disabled = true;
                e.innerHTML = `<span class="skel" style="display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px"></span> Extracting all pages & syllabus with AI…`;
                toast(`Extracting detailed syllabus for ${code || title}...`);
                const r = await API.extractCourse(docId, courseQuery, S.file, force);
                if (!r.ok) {
                    toast('Extraction failed: ' + (r.err || 'error'), 'er');
                    e.disabled = false;
                    e.innerHTML = I('up') + ' Extract all units & topics for this course';
                    return;
                }
                const detailData = r.data;
                if (S.doc) {
                    if (!S.doc.details) S.doc.details = {};
                    const key = code || title;
                    S.doc.details[key] = detailData;
                    if (code) S.doc.details[code] = detailData;
                    if (title) S.doc.details[title] = detailData;
                    const combo = `${code} | ${title}`.trim();
                    if (combo) S.doc.details[combo] = detailData;

                    const cInfo = detailData.course || {};
                    if (S.cur?.c) {
                        if (cInfo.pages?.length) {
                            S.cur.c.pages = cInfo.pages;
                            S.cur.c.page = cInfo.pages[0];
                            S.cur.pgs = cInfo.pages;
                            S.pg = cInfo.pages[0];
                        }
                        if (cInfo.credits !== undefined) S.cur.c.credits = cInfo.credits;
                        if (cInfo.category) S.cur.c.category = cInfo.category;
                    }
                    if (S.cur) S.cur.d = detailData;
                }
                toast('Course syllabus extracted with all units, topics, outcomes & books!');
                route();
            },
            async extractAllCourses(e) {
                const docId = S.doc?.id;
                if (!docId) return toast('No document selected', 'er');
                e.disabled = true; e.textContent = 'Extracting all courses in background…';
                toast(`Starting full extraction of all ${S.doc.courses.length} courses...`);
                const r = await API.extractAllCourses(docId);
                if (!r.ok) { e.disabled = false; e.textContent = `Extract All ${S.doc.courses.length} Courses`; return toast('Bulk extraction failed: ' + (r.err || 'error'), 'er'); }
                toast(`All ${S.doc.courses.length} courses successfully extracted with full units & topics!`);
                S.doc = null; // force reload doc details
                route();
            },
            saveapi() { localStorage.siqApi = $('#au').value.trim(); S.docs = null; ping(); toast('Backend URL saved') }, repi() { ping().then(() => route()) }, mock(e) { localStorage.siqMock = e.checked ? '1' : '0'; location.reload() }
        };
        function go(d) { const { doc } = S.cur, i = +location.hash.split('/')[3] + d; if (doc.courses[i]) location.hash = `#/course/${doc.id}/${i}` }
        document.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a && A[a.dataset.a]) { if (a.tagName == 'A' && a.dataset.a != 'viewsrc') e.preventDefault(); A[a.dataset.a](a, e) } });
        document.addEventListener('change', e => { const t = e.target, s = S.set; if (t.name == 'mode') { s.mode = t.value; $('#cw').style.display = t.value == 'course' ? '' : 'none'; sv('siqSet', s) } else if (t.dataset.p && t.type == 'checkbox') { s.proc[t.dataset.p] = t.checked } else if (t.id == 'ocr') s.ocr = t.checked; else if (t.dataset.adv) s.adv[t.dataset.adv] = +t.value; else if (t.dataset.f && t.tagName == 'SELECT') { S.f[t.dataset.f] = t.value; S.f.pg = 0; drawTable() } else if (t.dataset.a == 'ptype') { S.tab.pt = t.value; pagesView(S.doc) } sv('siqSet', s) });
        document.addEventListener('input', e => { const t = e.target; if (t.dataset.f && t.type == 'text') { S.f.q = t.value; S.f.pg = 0; drawTable() } if (t.id == 'cc') S.set.course = t.value });
        document.addEventListener('keydown', async e => {
            const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
            if (e.key == 'Escape') modal(''); if (typing && e.key == 'Enter' && document.activeElement.id == 'pn') showPage(+document.activeElement.value || 1);
            if (typing && e.key == 'Enter' && document.activeElement.id == 'ps') { const q = document.activeElement.value.toLowerCase(), p = await pdfFor(S.cur.doc); if (!p || !q) return toast('PDF search needs the uploaded PDF', 'er'); for (let n = 1; n <= p.numPages; n++) { const t = (await (await p.getPage(n)).getTextContent()).items.map(x => x.str).join(' ').toLowerCase(); if (t.includes(q)) return showPage(n) } toast('No match found', 'er') }
            if (typing) return; if (e.key == '/') { e.preventDefault(); $('#gq').focus() } if (e.key == '[') A.collapse()
        });
        function route() {
            try {
                const hash = window.location.hash || '';
                const [p, ...a] = (hash.slice(2) || 'dashboard').split('/');
                S.tok++;
                if (S.timer) clearInterval(S.timer);
                if ($('#app')) $('#app').classList.remove('open');
                shell();
                if ($('#view')) $('#view').scrollTop = 0;
                if (p !== 'course') S.pg = null;
                const viewFn = R[p] || R.dashboard;
                Promise.resolve(viewFn(...a.map(decodeURIComponent))).catch(err => {
                    console.error('Route error:', err);
                    set(errBox({ err: String(err) }));
                });
            } catch (err) {
                console.error('Route sync error:', err);
                set(errBox({ err: String(err) }));
            }
        }
        try {
            document.documentElement.dataset.t = (localStorage && localStorage.siqTheme) || (window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.dataset.t = 'light';
        }
        window.addEventListener('hashchange', route);
        window.addEventListener('DOMContentLoaded', () => { route(); ping(); });
        route();
        ping().then(() => { if (!/^#\/(processing|extract)/.test(window.location.hash)) route(); });
        setInterval(ping, 30000);
    </script>
